<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Arcade</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial;
}

body{
background:#070b18;
color:white;
display:flex;
min-height:100vh;
}


/* SIDEBAR */

.sidebar{
width:250px;
background:#0b1020;
padding:25px;
border-right:1px solid #222;
}


.logo{
font-size:28px;
font-weight:bold;
color:#22c55e;
margin-bottom:30px;
}


.nav{
padding:14px;
margin:12px 0;
background:#151b32;
border-radius:12px;
cursor:pointer;
transition:.3s;
}


.nav:hover{
background:#22c55e;
color:black;
}


/* MAIN */

.main{
flex:1;
padding:25px;
}


/* HERO */

.hero{

height:260px;
border-radius:25px;
padding:40px;

background:
linear-gradient(90deg,#000,transparent),
url("https://images.unsplash.com/photo-1542751371-adc38448a05e");

background-size:cover;

display:flex;
flex-direction:column;
justify-content:center;

margin-bottom:25px;

}


.hero h1{
font-size:50px;
}


.hero button{

width:150px;
padding:12px;

margin-top:20px;

border:none;
border-radius:20px;

background:#22c55e;

font-weight:bold;

cursor:pointer;

}


/* SEARCH */


.topbar{

display:flex;
gap:15px;
margin-bottom:25px;

}


#search,#category{

padding:15px;
border-radius:15px;
border:none;

background:#151b32;
color:white;

}


/* CARDS */


.games{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(230px,1fr));

gap:25px;

}


.card{

background:#111827;

padding:25px;

border-radius:20px;

transition:.3s;

}


.card:hover{

transform:scale(1.05);

box-shadow:
0 0 25px #22c55e;

}


.icon{

font-size:60px;

}


.play-btn{

width:100%;
padding:12px;

margin-top:15px;

border:none;
border-radius:15px;

background:#22c55e;

cursor:pointer;

}


.fav-btn{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:15px;

background:#f59e0b;

cursor:pointer;

}



/* MOBILE */

@media(max-width:700px){

body{
flex-direction:column;
}


.sidebar{

width:100%;

}


.hero h1{

font-size:30px;

}

}
</style>
</head>
<body>

<div class="sidebar">

<div class="logo">🎮 PRO ARCADE</div>

<div class="nav" onclick="showAllGames()">🏠 Home</div>

<div class="nav" onclick="showTrending()">🔥 Trending</div>

<div class="nav" onclick="showFavorites()">⭐ Favorites</div>

</div>

<div class="main">

<div class="topbar">

<input
type="text"
id="search"
placeholder="Search games..."
>

<select id="category">
<option value="all">All Categories</option>
<option value="arcade">Arcade</option>
<option value="puzzle">Puzzle</option>
<option value="board">Board</option>
<option value="action">Action</option>
</select>

</div>
<section class="games" id="games">

<div class="card" data-category="arcade">
<div class="icon">🐍</div>
<h2>Snake</h2>
<button class="play-btn" onclick="openGame('Snake','games/snake.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Snake')">⭐ Favorite</button>
</div>

<div class="card" data-category="puzzle">
<div class="icon">🧩</div>
<h2>Tetris</h2>
<button class="play-btn" onclick="openGame('Tetris','games/tetris.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Tetris')">⭐ Favorite</button>
</div>

<div class="card" data-category="arcade">
<div class="icon">👻</div>
<h2>Pacman</h2>
<button class="play-btn" onclick="openGame('Pacman','games/pacman.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Pacman')">⭐ Favorite</button>
</div>

<div class="card" data-category="board">
<div class="icon">♟️</div>
<h2>Chess</h2>
<button class="play-btn" onclick="openGame('Chess','games/chess.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Chess')">⭐ Favorite</button>
</div>

<div class="card" data-category="puzzle">
<div class="icon">🔢</div>
<h2>Sudoku</h2>
<button class="play-btn" onclick="openGame('Sudoku','games/sudoku.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Sudoku')">⭐ Favorite</button>
</div>

<div class="card" data-category="puzzle">
<div class="icon">🧠</div>
<h2>Memory Match</h2>
<button class="play-btn" onclick="openGame('Memory Match','games/memory-match.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Memory Match')">⭐ Favorite</button>
</div>

<div class="card" data-category="action">
<div class="icon">🧱</div>
<h2>Breakout</h2>
<button class="play-btn" onclick="openGame('Breakout','games/breakout.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Breakout')">⭐ Favorite</button>
</div>

<div class="card" data-category="board">
<div class="icon">❌</div>
<h2>Tic Tac Toe</h2>
<button class="play-btn" onclick="openGame('Tic Tac Toe','games/tic-tac-toe.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Tic Tac Toe')">⭐ Favorite</button>
</div>

<div class="card" data-category="action">
<div class="icon">🚀</div>
<h2>Space Shooter</h2>
<button class="play-btn" onclick="openGame('Space Shooter','games/space-shooter.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Space Shooter')">⭐ Favorite</button>
</div>

<div class="card" data-category="puzzle">
<div class="icon">🎲</div>
<h2>2048</h2>
<button class="play-btn" onclick="openGame('2048','games/2048.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('2048')">⭐ Favorite</button>
</div>

<div class="card" data-category="action">
<div class="icon">🍉</div>
<h2>Fruit Ninja</h2>
<button class="play-btn" onclick="openGame('Fruit Ninja','games/FruitNinja.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Fruit Ninja')">⭐ Favorite</button>
</div>

<div class="card" data-category="action">
<div class="icon">🏍️</div>
<h2>Bike Racing</h2>
<button class="play-btn" onclick="openGame('Bike Racing','games/bike-racing.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Bike Racing')">⭐ Favorite</button>
</div>

<div class="card" data-category="arcade">
<div class="icon">🐦</div>
<h2>Flappy Bird</h2>
<button class="play-btn" onclick="openGame('Flappy Bird','games/flappybird.html')">Play</button>
<button class="fav-btn" onclick="toggleFavorite('Flappy Bird')">⭐ Favorite</button>
</div>

</section>

</div>

<script>
function openGame(gameName,file){

    let plays =
    Number(localStorage.getItem(gameName) || 0);

    localStorage.setItem(
        gameName,
        plays + 1
    );

    window.location.href = file;
}

/* SEARCH */

document.getElementById("search")
.addEventListener("keyup", function(){

    let value =
    this.value.toLowerCase();

    document
    .querySelectorAll(".card")
    .forEach(card=>{

        let text =
        card.querySelector("h2")
        .textContent
        .toLowerCase();

        card.style.display =
        text.includes(value)
        ? "block"
        : "none";
    });
});

/* CATEGORY */

document.getElementById("category")
.addEventListener("change", function(){

    let cat = this.value;

    document
    .querySelectorAll(".card")
    .forEach(card=>{

        card.style.display =
        cat === "all" ||
        card.dataset.category === cat
        ? "block"
        : "none";
    });
});

/* HOME */

function showAllGames(){

    document
    .querySelectorAll(".card")
    .forEach(card=>{
document.getElementById("category").value = "all";
document.getElementById("search").value = "";
        card.style.display = "block";
    });
}

/* FAVORITES */

function toggleFavorite(game){

    let favs = JSON.parse(
        localStorage.getItem("favorites") || "[]"
    );

    if(favs.includes(game)){

        favs = favs.filter(
            item => item !== game
        );

    }else{

        favs.push(game);
    }

    localStorage.setItem(
        "favorites",
        JSON.stringify(favs)
    );

    updateFavoriteButtons();
}

function updateFavoriteButtons(){

    let favs = JSON.parse(
        localStorage.getItem("favorites") || "[]"
    );

    document.querySelectorAll(".fav-btn")
    .forEach(btn=>{

        let game =
        btn.parentElement
        .querySelector("h2")
        .textContent;

        btn.textContent =
        favs.includes(game)
        ? "⭐ Remove Favorite"
        : "⭐ Add Favorite";
    });
}
function showFavorites(){

    let favs = JSON.parse(
        localStorage.getItem("favorites") || "[]"
    );

    if(favs.length === 0){

        let allGames = [];

        document
        .querySelectorAll(".card h2")
        .forEach(game=>{

            allGames.push(
                game.textContent
            );
        });

        let choice = prompt(
            "No favorites yet.\n\nAvailable Games:\n\n" +
            allGames.join("\n") +
            "\n\nType a game name to add:"
        );

        if(choice){

            let gameFound =
            allGames.find(
                game =>
                game.toLowerCase() ===
                choice.toLowerCase()
            );

            if(gameFound){

                favs.push(gameFound);

                localStorage.setItem(
                    "favorites",
                    JSON.stringify(favs)
                );

                updateFavoriteButtons();

                alert(
                    gameFound +
                    " added to favorites!"
                );

            }else{

                alert("Game not found.");
            }
        }

        return;
    }

    document
    .querySelectorAll(".card")
    .forEach(card=>{

        let game =
        card.querySelector("h2")
        .textContent;

        card.style.display =
        favs.includes(game)
        ? "block"
        : "none";
    });
}
/* TRENDING */

function showTrending(){

    let found = false;

    document
    .querySelectorAll(".card")
    .forEach(card=>{

        let game =
        card.querySelector("h2")
        .textContent;

        let plays =
        Number(localStorage.getItem(game) || 0);

        if(plays > 0){
            card.style.display = "block";
            found = true;
        }else{
            card.style.display = "none";
        }
    });

    if(!found){
        alert("Play some games first.");
    }
}

updateFavoriteButtons();
</script>

</body>
</html>
