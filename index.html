<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Arcade</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    min-height:100vh;
    display:flex;
    background:linear-gradient(135deg,#050816,#0f172a);
    color:white;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#22c55e;
}

.nav{
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.nav:hover{
    background:rgba(34,197,94,0.2);
}

/* MAIN */
.main{
    flex:1;
    padding:20px;
}

/* TOPBAR */
.topbar{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.topbar input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
}

/* GRID */
.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

/* CARD */
.card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    padding:20px;
    border-radius:15px;
    position:relative;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#22c55e;
}

.icon{font-size:40px;}

.play-btn{
    margin-top:10px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">🎮 PRO ARCADE</div>

    <div class="nav">🏠 Home</div>
    <div class="nav">🔥 Trending</div>
    <div class="nav">⭐ Favorites</div>
    <div class="nav">🎲 Categories</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
    <input id="search" placeholder="Search games...">
</div>

<section class="games">

<div class="card">
<div class="icon">🐍</div>
<h2>Snake</h2>
<button class="play-btn" onclick="openGame('games/snake.html')">Play</button>
</div>

<div class="card">
<div class="icon">🧩</div>
<h2>Tetris</h2>
<button class="play-btn" onclick="openGame('games/tetris.html')">Play</button>
</div>

<div class="card">
<div class="icon">👻</div>
<h2>Pacman</h2>
<button class="play-btn" onclick="openGame('games/pacman.html')">Play</button>
</div>

<div class="card">
<div class="icon">♟️</div>
<h2>Chess</h2>
<button class="play-btn" onclick="openGame('games/chess.html')">Play</button>
</div>

<div class="card">
<div class="icon">🔢</div>
<h2>Sudoku</h2>
<button class="play-btn" onclick="openGame('games/sudoku.html')">Play</button>
</div>

<div class="card">
<div class="icon">🧠</div>
<h2>Memory Match</h2>
<button class="play-btn" onclick="openGame('games/memory-match.html')">Play</button>
</div>

<div class="card">
<div class="icon">🧱</div>
<h2>Breakout</h2>
<button class="play-btn" onclick="openGame('games/breakout.html')">Play</button>
</div>

<div class="card">
<div class="icon">❌</div>
<h2>Tic Tac Toe</h2>
<button class="play-btn" onclick="openGame('games/tic-tac-toe.html')">Play</button>
</div>

<div class="card">
<div class="icon">🚀</div>
<h2>Space Shooter</h2>
<button class="play-btn" onclick="openGame('games/space-shooter.html')">Play</button>
</div>

<div class="card">
<div class="icon">🎲</div>
<h2>2048</h2>
<button class="play-btn" onclick="openGame('games/2048.html')">Play</button>
</div>

<div class="card">
<div class="icon">🍉</div>
<h2>Fruit Ninja</h2>
<button class="play-btn" onclick="openGame('games/FruitNinja.html')">Play</button>
</div>

<div class="card">
<div class="icon">🏍️</div>
<h2>Bike Racing</h2>
<button class="play-btn" onclick="openGame('games/bike-racing.html')">Play</button>
</div>

<div class="card">
<div class="icon">🐦</div>
<h2>Flappy Bird</h2>
<button class="play-btn" onclick="openGame('games/flappybird.html')">Play</button>
</div>

</section>
</div>

<script>
/* FIXED NAVIGATION (IMPORTANT) */
function openGame(file){
    window.location.href = file;
}
</script>

</body>
</html>
