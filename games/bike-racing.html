<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bike Racing Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    margin:auto;
    background:#444;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:20px;
    z-index:10;
}

#ui div{
    margin-bottom:6px;
}

#topButtons{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:10px;
    z-index:10;
}

.topBtn{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    display:none;
    z-index:20;
}

#gameOver button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#mobileControls{
    position:fixed;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:20px;
    z-index:15;
}

#mobileControls button{
    width:80px;
    height:80px;
    border:none;
    border-radius:50%;
    font-size:35px;
    background:#222;
    color:white;
}

@media(min-width:900px){
    #mobileControls{
        display:none;
    }
}
</style>
</head>
<body>

<div id="ui">
    <div id="score">Score: 0</div>
    <div id="lives">❤️❤️❤️</div>
    <div id="high">High: 0</div>
    <div>Nitro ⚡</div>
</div>

<div id="topButtons">
    <button class="topBtn" onclick="togglePause()">⏸️</button>
    <button class="topBtn" onclick="toggleTheme()">🌙</button>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <br>
    <button onclick="restart()">Restart</button>
</div>

<canvas id="game" width="400" height="700"></canvas>

<div id="mobileControls">
    <button id="leftBtn">⬅️</button>
    <button id="nitroBtn">⚡</button>
    <button id="rightBtn">➡️</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let score=0;
let lives=3;
let nitro=100;
let roadOffset=0;
let gameOver=false;
let paused=false;

let highScore=
parseInt(localStorage.getItem("bikeHigh"))||0;

document.getElementById("high").innerHTML=
"High: "+highScore;

const bike={
    x:175,
    y:580,
    speed:8
};

let cars=[];
let coins=[];
let trees=[];
let keys={};

document.addEventListener("keydown",e=>{
    keys[e.key]=true;

    if(gameOver && e.key==="Enter"){
        restart();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key]=false;
});

let leftPressed=false;
let rightPressed=false;
let nitroPressed=false;

leftBtn.addEventListener("touchstart",()=>leftPressed=true);
leftBtn.addEventListener("touchend",()=>leftPressed=false);

rightBtn.addEventListener("touchstart",()=>rightPressed=true);
rightBtn.addEventListener("touchend",()=>rightPressed=false);

nitroBtn.addEventListener("touchstart",()=>nitroPressed=true);
nitroBtn.addEventListener("touchend",()=>nitroPressed=false);

function spawnCar(){

    const vehicles=[
        "🚗","🚕","🚙","🚓","🚚"
    ];

    cars.push({
        x:Math.random()*320+20,
        y:-100,
        w:50,
        h:80,
        emoji:vehicles[
            Math.floor(Math.random()*vehicles.length)
        ]
    });
}

function spawnCoin(){
    coins.push({
        x:Math.random()*320+20,
        y:-50
    });
}

function spawnTree(){
    trees.push({
        x:Math.random()<0.5 ? 20 : 360,
        y:-50
    });
}

setInterval(()=>{
    if(!gameOver && !paused){

        spawnCar();

        if(Math.random()<0.6){
            spawnCoin();
        }

        if(Math.random()<0.7){
            spawnTree();
        }
    }
},900);

function update(){

    if(gameOver || paused) return;

    let speed=8;

    if(
        keys["ArrowUp"]||
        keys[" "]||
        keys["w"]||
        nitroPressed
    ){
        if(nitro>0){
            speed=16;
            nitro-=0.6;
        }
    }

    if(
        keys["ArrowLeft"]||
        keys["a"]||
        leftPressed
    ){
        bike.x-=bike.speed;
    }

    if(
        keys["ArrowRight"]||
        keys["d"]||
        rightPressed
    ){
        bike.x+=bike.speed;
    }

    bike.x=Math.max(
        10,
        Math.min(canvas.width-60,bike.x)
    );

    cars.forEach(car=>{
        car.y+=speed;
    });

    coins.forEach(coin=>{
        coin.y+=speed;
    });

    trees.forEach(tree=>{
        tree.y+=speed;
    });

    for(let i=cars.length-1;i>=0;i--){

        let c=cars[i];

        if(
            bike.x<c.x+c.w &&
            bike.x+50>c.x &&
            bike.y<c.y+c.h &&
            bike.y+50>c.y
        ){

            cars.splice(i,1);

            lives--;

            updateUI();

            if(lives<=0){
                endGame();
            }
        }

        if(c.y>canvas.height){

            cars.splice(i,1);

            score++;

            updateUI();
        }
    }

    for(let i=coins.length-1;i>=0;i--){

        const coin=coins[i];

        if(
            Math.abs(coin.x-bike.x)<40 &&
            Math.abs(coin.y-bike.y)<40
        ){

            coins.splice(i,1);

            score+=5;

            nitro=Math.min(
                100,
                nitro+10
            );

            updateUI();
        }
    }

    nitro=Math.min(
        100,
        nitro+0.05
    );
}

function drawRoad(){

    ctx.fillStyle="#444";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="#2c2c2c";
    ctx.fillRect(50,0,300,700);

    roadOffset+=10;

    ctx.fillStyle="white";

    for(
        let y=-80;
        y<700;
        y+=90
    ){

        ctx.fillRect(
            195,
            y+(roadOffset%90),
            10,
            50
        );
    }
}

function draw(){

    drawRoad();

    trees.forEach(tree=>{
        ctx.font="35px Arial";
        ctx.fillText(
            "🌳",
            tree.x,
            tree.y
        );
    });

    ctx.font="45px Arial";
    ctx.fillText(
        "🏍️",
        bike.x,
        bike.y
    );

    cars.forEach(car=>{
        ctx.font="45px Arial";
        ctx.fillText(
            car.emoji,
            car.x,
            car.y
        );
    });

    coins.forEach(coin=>{
        ctx.font="30px Arial";
        ctx.fillText(
            "🪙",
            coin.x,
            coin.y
        );
    });

    ctx.fillStyle="cyan";
    ctx.fillRect(
        10,
        660,
        nitro*2,
        15
    );

    ctx.strokeStyle="white";
    ctx.strokeRect(
        10,
        660,
        200,
        15
    );

    if(paused){

        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.fillText(
            "PAUSED",
            120,
            300
        );
    }
}

function updateUI(){

    document.getElementById("score")
    .innerHTML=
    "Score: "+score;

    document.getElementById("lives")
    .innerHTML=
    "❤️".repeat(lives);

    if(score>highScore){

        highScore=score;

        localStorage.setItem(
            "bikeHigh",
            highScore
        );

        document.getElementById("high")
        .innerHTML=
        "High: "+highScore;
    }
}

function togglePause(){
    paused=!paused;
}

function toggleTheme(){

    if(document.body.style.filter==="invert(1)"){
        document.body.style.filter="none";
    }else{
        document.body.style.filter="invert(1)";
    }
}

function endGame(){

    gameOver=true;

    document.getElementById(
        "gameOver"
    ).style.display="block";
}

function restart(){

    score=0;
    lives=3;
    nitro=100;

    cars=[];
    coins=[];
    trees=[];

    bike.x=175;

    gameOver=false;
    paused=false;

    document.getElementById(
        "gameOver"
    ).style.display="none";

    updateUI();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

updateUI();
loop();

</script>
</body>
</html>
