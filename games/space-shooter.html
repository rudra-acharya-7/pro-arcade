<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    margin:auto;
    background:linear-gradient(#000,#050520);
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:20px;
    z-index:10;
}

#ui div{
    margin-bottom:5px;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    display:none;
}

#gameOver button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#mobileControls{
    position:fixed;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:15px;
}

#mobileControls button{
    width:70px;
    height:70px;
    border:none;
    border-radius:50%;
    font-size:30px;
    background:#222;
    color:white;
}

@media(min-width:900px){
    #mobileControls{
        display:none;
    }
}
</style>
</head>
<body>

<div id="ui">
    <div id="score">Score: 0</div>
    <div id="lives">❤️❤️❤️</div>
    <div id="high">High: 0</div>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <br>
    <button onclick="restart()">Restart</button>
</div>

<canvas id="game" width="400" height="700"></canvas>

<div id="mobileControls">
    <button id="leftBtn">⬅️</button>
    <button id="fireBtn">🔥</button>
    <button id="rightBtn">➡️</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let score=0;
let lives=3;
let gameOver=false;

let highScore=
parseInt(localStorage.getItem("spaceHigh"))||0;

document.getElementById("high").innerHTML=
"High: "+highScore;

const player={
    x:180,
    y:620,
    w:40,
    h:40,
    speed:7
};

let bullets=[];
let enemies=[];
let stars=[];
let keys={};

for(let i=0;i<100;i++){
    stars.push({
        x:Math.random()*400,
        y:Math.random()*700,
        size:Math.random()*3
    });
}

document.addEventListener("keydown",e=>{
    keys[e.key]=true;

    if(e.key===" "){
        shoot();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key]=false;
});

let leftPressed=false;
let rightPressed=false;

leftBtn.addEventListener("touchstart",()=>{
    leftPressed=true;
});

leftBtn.addEventListener("touchend",()=>{
    leftPressed=false;
});

rightBtn.addEventListener("touchstart",()=>{
    rightPressed=true;
});

rightBtn.addEventListener("touchend",()=>{
    rightPressed=false;
});

fireBtn.addEventListener("touchstart",()=>{
    shoot();
});

function shoot(){

    if(gameOver) return;

    bullets.push({
        x:player.x+15,
        y:player.y
    });
}

function spawnEnemy(){

    enemies.push({
        x:Math.random()*340+10,
        y:-50,
        speed:3+Math.random()*3
    });
}

setInterval(()=>{

    if(!gameOver){
        spawnEnemy();
    }

},800);

function update(){

    if(gameOver) return;

    if(keys["ArrowLeft"]||keys["a"]||leftPressed){
        player.x-=player.speed;
    }

    if(keys["ArrowRight"]||keys["d"]||rightPressed){
        player.x+=player.speed;
    }

    player.x=Math.max(
        0,
        Math.min(canvas.width-player.w,player.x)
    );

    stars.forEach(star=>{
        star.y+=2;

        if(star.y>700){
            star.y=0;
        }
    });

    bullets.forEach(b=>{
        b.y-=10;
    });

    enemies.forEach(e=>{
        e.y+=e.speed;
    });

    bullets=bullets.filter(
        b=>b.y>-20
    );

    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

        if(e.y>700){

            enemies.splice(i,1);

            lives--;

            updateUI();

            if(lives<=0){
                endGame();
            }

            continue;
        }

        if(
            player.x<e.x+40 &&
            player.x+40>e.x &&
            player.y<e.y+40 &&
            player.y+40>e.y
        ){

            enemies.splice(i,1);

            lives--;

            updateUI();

            if(lives<=0){
                endGame();
            }
        }
    }

    for(let i=bullets.length-1;i>=0;i--){

        for(let j=enemies.length-1;j>=0;j--){

            if(
                bullets[i] &&
                enemies[j] &&
                bullets[i].x<enemies[j].x+40 &&
                bullets[i].x+10>enemies[j].x &&
                bullets[i].y<enemies[j].y+40 &&
                bullets[i].y+10>enemies[j].y
            ){

                bullets.splice(i,1);
                enemies.splice(j,1);

                score++;

                updateUI();

                break;
            }
        }
    }
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    stars.forEach(star=>{

        ctx.fillStyle="white";

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );
    });

    ctx.font="40px Arial";
    ctx.fillText(
        "🚀",
        player.x,
        player.y
    );

    bullets.forEach(b=>{

        ctx.fillStyle="cyan";

        ctx.fillRect(
            b.x,
            b.y,
            5,
            15
        );
    });

    enemies.forEach(e=>{

        ctx.font="35px Arial";

        ctx.fillText(
            "👾",
            e.x,
            e.y
        );
    });
}

function updateUI(){

    document.getElementById("score")
    .innerHTML=
    "Score: "+score;

    document.getElementById("lives")
    .innerHTML=
    "❤️".repeat(lives);

    if(score>highScore){

        highScore=score;

        localStorage.setItem(
            "spaceHigh",
            highScore
        );

        document.getElementById("high")
        .innerHTML=
        "High: "+highScore;
    }
}

function endGame(){

    gameOver=true;

    document.getElementById(
        "gameOver"
    ).style.display="block";
}

function restart(){

    score=0;
    lives=3;
    bullets=[];
    enemies=[];
    gameOver=false;

    document.getElementById(
        "gameOver"
    ).style.display="none";

    updateUI();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

updateUI();
loop();

</script>

</body>
</html>
