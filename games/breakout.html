<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    overflow:hidden;
    font-family:Arial,sans-serif;
    text-align:center;
}

canvas{
    background:#000;
    display:block;
    margin:auto;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:20px;
    text-align:left;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    display:none;
}

#gameOver button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

#mobileControls{
    position:fixed;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:20px;
}

#mobileControls button{
    width:80px;
    height:80px;
    border:none;
    border-radius:50%;
    font-size:35px;
    background:#222;
    color:white;
}

@media(min-width:900px){
    #mobileControls{
        display:none;
    }
}
</style>
</head>
<body>

<div id="ui">
    <div id="score">Score: 0</div>
    <div id="lives">❤️❤️❤️</div>
    <div id="high">High: 0</div>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <br>
    <button onclick="restart()">Restart</button>
</div>

<canvas id="game" width="400" height="700"></canvas>

<div id="mobileControls">
    <button id="leftBtn">⬅️</button>
    <button id="rightBtn">➡️</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let score=0;
let lives=3;
let gameOver=false;

let highScore=
parseInt(localStorage.getItem("breakoutHigh"))||0;

document.getElementById("high").innerHTML=
"High: "+highScore;

const paddle={
    x:150,
    y:650,
    w:100,
    h:15,
    speed:8
};

const ball={
    x:200,
    y:500,
    r:10,
    dx:4,
    dy:-4
};

let bricks=[];
let keys={};

for(let r=0;r<6;r++){

    for(let c=0;c<8;c++){

        bricks.push({
            x:c*48+10,
            y:r*35+50,
            w:40,
            h:20,
            alive:true
        });
    }
}

document.addEventListener("keydown",e=>{
    keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.key]=false;
});

let leftPressed=false;
let rightPressed=false;

leftBtn.addEventListener("touchstart",()=>{
    leftPressed=true;
});

leftBtn.addEventListener("touchend",()=>{
    leftPressed=false;
});

rightBtn.addEventListener("touchstart",()=>{
    rightPressed=true;
});

rightBtn.addEventListener("touchend",()=>{
    rightPressed=false;
});

function update(){

    if(gameOver) return;

    if(
        keys["ArrowLeft"]||
        keys["a"]||
        leftPressed
    ){
        paddle.x-=paddle.speed;
    }

    if(
        keys["ArrowRight"]||
        keys["d"]||
        rightPressed
    ){
        paddle.x+=paddle.speed;
    }

    paddle.x=Math.max(
        0,
        Math.min(
            canvas.width-paddle.w,
            paddle.x
        )
    );

    ball.x+=ball.dx;
    ball.y+=ball.dy;

    if(
        ball.x-ball.r<0 ||
        ball.x+ball.r>canvas.width
    ){
        ball.dx*=-1;
    }

    if(ball.y-ball.r<0){
        ball.dy*=-1;
    }

    if(
        ball.y+ball.r>=paddle.y &&
        ball.x>paddle.x &&
        ball.x<paddle.x+paddle.w
    ){
        ball.dy=-Math.abs(ball.dy);
    }

    for(let brick of bricks){

        if(!brick.alive) continue;

        if(
            ball.x>brick.x &&
            ball.x<brick.x+brick.w &&
            ball.y>brick.y &&
            ball.y<brick.y+brick.h
        ){

            brick.alive=false;

            ball.dy*=-1;

            score++;

            updateUI();
        }
    }

    if(ball.y>canvas.height){

        lives--;

        updateUI();

        if(lives<=0){

            endGame();

        }else{

            resetBall();
        }
    }

    if(
        bricks.every(
            brick=>!brick.alive
        )
    ){

        alert("🎉 YOU WIN!");

        restart();
    }
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="#00ff88";

    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.w,
        paddle.h
    );

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fillStyle="white";
    ctx.fill();

    bricks.forEach(brick=>{

        if(!brick.alive) return;

        ctx.fillStyle=
        `hsl(${brick.y},80%,60%)`;

        ctx.fillRect(
            brick.x,
            brick.y,
            brick.w,
            brick.h
        );
    });
}

function resetBall(){

    ball.x=200;
    ball.y=500;
    ball.dx=4;
    ball.dy=-4;
}

function updateUI(){

    document.getElementById("score")
    .innerHTML=
    "Score: "+score;

    document.getElementById("lives")
    .innerHTML=
    "❤️".repeat(lives);

    if(score>highScore){

        highScore=score;

        localStorage.setItem(
            "breakoutHigh",
            highScore
        );

        document.getElementById("high")
        .innerHTML=
        "High: "+highScore;
    }
}

function endGame(){

    gameOver=true;

    document.getElementById(
        "gameOver"
    ).style.display="block";
}

function restart(){

    score=0;
    lives=3;
    gameOver=false;

    bricks=[];

    for(let r=0;r<6;r++){

        for(let c=0;c<8;c++){

            bricks.push({
                x:c*48+10,
                y:r*35+50,
                w:40,
                h:20,
                alive:true
            });
        }
    }

    resetBall();

    document.getElementById(
        "gameOver"
    ).style.display="none";

    updateUI();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

updateUI();
loop();

</script>

</body>
</html>
