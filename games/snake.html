<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    text-align:center;
}

h1{
    margin-bottom:15px;
    color:#22c55e;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:18px;
}

canvas{
    background:#0f172a;
    border:4px solid #22c55e;
    border-radius:8px;
}

.controls{
    margin-top:15px;
    color:#cbd5e1;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:6px;
    background:#22c55e;
    color:#fff;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#16a34a;
}

#gameOver{
    margin-top:10px;
    color:#ef4444;
    font-size:24px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

    <h1>🐍 Snake</h1>

    <div class="info">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="best">0</span></div>
    </div>

    <canvas id="game" width="500" height="500"></canvas>

    <div id="gameOver"></div>

    <button onclick="restartGame()">New Game</button>

    <div class="controls">
        Use Arrow Keys or WASD to move
    </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const gameOverEl = document.getElementById("gameOver");

const gridSize = 25;
const tileCount = canvas.width / gridSize;

let snake, food, dx, dy;
let score, bestScore;
let lastTime = 0;
let speed = 8; // moves per second
let accumulator = 0;
let gameRunning = true;

bestScore = localStorage.getItem("snakeBest") || 0;
bestEl.textContent = bestScore;

function init(){

    snake = [
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}
    ];

    dx = 1;
    dy = 0;
    score = 0;
    scoreEl.textContent = score;
    gameOverEl.textContent = "";

    placeFood();
    gameRunning = true;
}

function placeFood(){
    food = {
        x: Math.floor(Math.random()*tileCount),
        y: Math.floor(Math.random()*tileCount)
    };
}

function update(){

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // wall
    if(head.x < 0 || head.y < 0 || head.x >= tileCount || head.y >= tileCount){
        return endGame();
    }

    // self
    for(let s of snake){
        if(head.x === s.x && head.y === s.y){
            return endGame();
        }
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){

        score += 10;
        scoreEl.textContent = score;

        if(score > bestScore){
            bestScore = score;
            localStorage.setItem("snakeBest", bestScore);
            bestEl.textContent = bestScore;
        }

        placeFood();

        // speed up slightly
        if(speed < 14) speed += 0.2;

    } else {
        snake.pop();
    }
}

function draw(){

    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // food glow
    ctx.shadowColor = "#ef4444";
    ctx.shadowBlur = 15;

    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(
        food.x*gridSize + gridSize/2,
        food.y*gridSize + gridSize/2,
        gridSize/2.5,
        0,Math.PI*2
    );
    ctx.fill();

    ctx.shadowBlur = 0;

    // snake
    snake.forEach((s,i)=>{

        ctx.fillStyle = i===0 ? "#22c55e" : "#16a34a";

        ctx.fillRect(
            s.x*gridSize+2,
            s.y*gridSize+2,
            gridSize-4,
            gridSize-4
        );
    });
}

function loop(timestamp){

    if(!gameRunning) return;

    if(!lastTime) lastTime = timestamp;
    let delta = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    accumulator += delta;

    if(accumulator >= 1/speed){
        update();
        accumulator = 0;
    }

    draw();
    requestAnimationFrame(loop);
}

function endGame(){
    gameRunning = false;
    gameOverEl.textContent = "💀 Game Over! Score: " + score;
}

document.addEventListener("keydown", e=>{

    if(e.key==="ArrowUp" || e.key==="w"){
        if(dy !== 1){ dx=0; dy=-1; }
    }
    if(e.key==="ArrowDown" || e.key==="s"){
        if(dy !== -1){ dx=0; dy=1; }
    }
    if(e.key==="ArrowLeft" || e.key==="a"){
        if(dx !== 1){ dx=-1; dy=0; }
    }
    if(e.key==="ArrowRight" || e.key==="d"){
        if(dx !== -1){ dx=1; dy=0; }
    }
});

function restartGame(){
    speed = 8;
    init();
    lastTime = 0;
    requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
