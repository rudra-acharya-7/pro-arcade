<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:15px;
}

.container{
    text-align:center;
    width:100%;
    max-width:550px;
}

h1{
    color:#22c55e;
    margin-bottom:15px;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:18px;
}

canvas{
    width:100%;
    max-width:500px;
    aspect-ratio:1;
    background:#0f172a;
    border:4px solid #22c55e;
    border-radius:10px;
    touch-action:none;
}

#gameOver{
    margin-top:10px;
    color:#ef4444;
    font-size:24px;
    font-weight:bold;
}

.main-btn{
    margin-top:15px;
    padding:12px 24px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.controls{
    margin-top:20px;
}

.controls button{
    width:70px;
    height:70px;
    margin:5px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:30px;
    cursor:pointer;
}

.controls button:active{
    transform:scale(0.95);
}
</style>
</head>
<body>

<div class="container">

    <h1>🐍 Snake Game</h1>

    <div class="info">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="best">0</span></div>
    </div>

    <canvas id="game" width="500" height="500"></canvas>

    <div id="gameOver"></div>

    <button class="main-btn" onclick="restartGame()">
        New Game
    </button>

    <div class="controls">

        <div>
            <button onclick="changeDir('up')">⬆️</button>
        </div>

        <div>
            <button onclick="changeDir('left')">⬅️</button>
            <button onclick="changeDir('down')">⬇️</button>
            <button onclick="changeDir('right')">➡️</button>
        </div>

    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const gameOverEl = document.getElementById("gameOver");

const gridSize = 25;
const tileCount = canvas.width / gridSize;

let snake;
let food;
let dx;
let dy;
let score;
let bestScore;
let speed;
let gameRunning;
let accumulator = 0;
let lastTime = 0;

bestScore = localStorage.getItem("snakeBest") || 0;
bestEl.textContent = bestScore;

function init(){

    snake = [
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}
    ];

    dx = 1;
    dy = 0;

    score = 0;
    speed = 8;

    scoreEl.textContent = score;
    gameOverEl.textContent = "";

    placeFood();

    gameRunning = true;
}

function placeFood(){

    food = {
        x:Math.floor(Math.random()*tileCount),
        y:Math.floor(Math.random()*tileCount)
    };

}

function update(){

    const head = {
        x:snake[0].x + dx,
        y:snake[0].y + dy
    };

    if(
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tileCount ||
        head.y >= tileCount
    ){
        endGame();
        return;
    }

    for(let part of snake){

        if(head.x === part.x && head.y === part.y){
            endGame();
            return;
        }

    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){

        score += 10;
        scoreEl.textContent = score;

        if(score > bestScore){

            bestScore = score;
            bestEl.textContent = bestScore;

            localStorage.setItem(
                "snakeBest",
                bestScore
            );

        }

        placeFood();

        if(speed < 15){
            speed += 0.2;
        }

    }else{

        snake.pop();

    }

}

function draw(){

    ctx.fillStyle = "#0f172a";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "#ef4444";

    ctx.beginPath();
    ctx.arc(
        food.x*gridSize + gridSize/2,
        food.y*gridSize + gridSize/2,
        gridSize/2.5,
        0,
        Math.PI*2
    );
    ctx.fill();

    snake.forEach((part,index)=>{

        ctx.fillStyle =
            index===0
            ? "#22c55e"
            : "#16a34a";

        ctx.fillRect(
            part.x*gridSize+2,
            part.y*gridSize+2,
            gridSize-4,
            gridSize-4
        );

    });

}

function loop(timestamp){

    if(!gameRunning) return;

    if(!lastTime){
        lastTime = timestamp;
    }

    let delta =
        (timestamp-lastTime)/1000;

    lastTime = timestamp;

    accumulator += delta;

    if(accumulator >= 1/speed){

        update();
        accumulator = 0;

    }

    draw();

    requestAnimationFrame(loop);

}

function endGame(){

    gameRunning = false;

    gameOverEl.textContent =
        "💀 Game Over! Score: " + score;

}

function changeDir(dir){

    if(dir==="up" && dy!==1){
        dx=0;
        dy=-1;
    }

    if(dir==="down" && dy!==-1){
        dx=0;
        dy=1;
    }

    if(dir==="left" && dx!==1){
        dx=-1;
        dy=0;
    }

    if(dir==="right" && dx!==-1){
        dx=1;
        dy=0;
    }

}

document.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowUp" || e.key==="w"){
        changeDir("up");
    }

    if(e.key==="ArrowDown" || e.key==="s"){
        changeDir("down");
    }

    if(e.key==="ArrowLeft" || e.key==="a"){
        changeDir("left");
    }

    if(e.key==="ArrowRight" || e.key==="d"){
        changeDir("right");
    }

});

let startX = 0;
let startY = 0;

canvas.addEventListener("touchstart",(e)=>{

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;

});

canvas.addEventListener("touchend",(e)=>{

    let endX =
        e.changedTouches[0].clientX;

    let endY =
        e.changedTouches[0].clientY;

    let diffX = endX - startX;
    let diffY = endY - startY;

    if(
        Math.abs(diffX) >
        Math.abs(diffY)
    ){

        if(diffX > 0){
            changeDir("right");
        }else{
            changeDir("left");
        }

    }else{

        if(diffY > 0){
            changeDir("down");
        }else{
            changeDir("up");
        }

    }

});

function restartGame(){

    accumulator = 0;
    lastTime = 0;

    init();

    requestAnimationFrame(loop);

}

init();
requestAnimationFrame(loop);
</script>

</body>
</html>
