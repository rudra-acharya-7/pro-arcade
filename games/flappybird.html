```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#70c5ce;
    font-family:Arial,sans-serif;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    text-align:center;
    position:relative;
}

canvas{
    background:#70c5ce;
    border:3px solid #333;
    border-radius:10px;
    width:min(95vw,400px);
    height:auto;
    touch-action:none;
}

#score{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    font-size:35px;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px 4px rgba(0,0,0,0.4);
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    display:none;
    background:rgba(0,0,0,0.7);
    padding:20px;
    border-radius:10px;
}

button{
    padding:10px 20px;
    font-size:18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

    <div id="score">0</div>

    <div id="gameOver">
        <h1>Game Over</h1>
        <p>Tap Screen or Press Space</p>
        <button onclick="restart()">Restart</button>
    </div>

    <canvas id="game" width="400" height="600"></canvas>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const gameOverBox = document.getElementById("gameOver");

let score = 0;
let gameRunning = true;

const bird = {
    x:100,
    y:250,
    width:40,
    height:40,
    velocity:0,
    gravity:0.5,
    jump:-8
};

let pipes = [];

function createPipe(){

    const gap = 160;

    const topHeight =
    Math.random() * 250 + 50;

    pipes.push({
        x:canvas.width,
        top:topHeight,
        bottom:topHeight + gap,
        width:60,
        passed:false
    });
}

setInterval(() => {

    if(gameRunning){
        createPipe();
    }

},1800);

function flap(){

    if(gameRunning){
        bird.velocity = bird.jump;
    }else{
        restart();
    }
}

document.addEventListener("keydown",(e)=>{

    if(e.code === "Space"){
        flap();
    }

});

canvas.addEventListener("click", flap);

canvas.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    flap();
},{passive:false});

function update(){

    if(!gameRunning) return;

    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    if(
        bird.y < 0 ||
        bird.y + bird.height > canvas.height
    ){
        endGame();
    }

    pipes.forEach(pipe => {

        pipe.x -= 3;

        if(
            bird.x < pipe.x + pipe.width &&
            bird.x + bird.width > pipe.x &&
            (
                bird.y < pipe.top ||
                bird.y + bird.height > pipe.bottom
            )
        ){
            endGame();
        }

        if(
            !pipe.passed &&
            pipe.x + pipe.width < bird.x
        ){
            pipe.passed = true;
            score++;
            scoreText.textContent = score;
        }

    });

    pipes = pipes.filter(
        pipe => pipe.x + pipe.width > 0
    );
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "#8ED6FF";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    pipes.forEach(pipe => {

        ctx.fillStyle = "green";

        ctx.fillRect(
            pipe.x,
            0,
            pipe.width,
            pipe.top
        );

        ctx.fillRect(
            pipe.x,
            pipe.bottom,
            pipe.width,
            canvas.height - pipe.bottom
        );

    });

    ctx.font = "35px Arial";
    ctx.fillText(
        "🐦",
        bird.x,
        bird.y + 35
    );
}

function endGame(){

    gameRunning = false;

    gameOverBox.style.display =
    "block";
}

function restart(){

    score = 0;

    bird.y = 250;
    bird.velocity = 0;

    pipes = [];

    gameRunning = true;

    scoreText.textContent = score;

    gameOverBox.style.display =
    "none";
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
