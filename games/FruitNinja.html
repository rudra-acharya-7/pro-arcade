<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Ninja</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(#111,#333);
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    z-index:100;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    display:none;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="ui">
    Score: <span id="score">0</span><br>
    Lives: <span id="lives">❤️❤️❤️</span><br>
    High: <span id="high">0</span>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <button onclick="restart()">Play Again</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let score = 0;
let lives = 3;
let gameOver = false;

let highScore =
parseInt(localStorage.getItem("fruitHigh")) || 0;

document.getElementById("high").textContent = highScore;

const fruits = [];
const trail = [];

class Fruit{

    constructor(){

        this.x = 80 + Math.random() * (canvas.width - 160);

        this.y = canvas.height + 50;

        this.vx = (Math.random() - 0.5) * 6;

        this.vy = -(16 + Math.random() * 6);

        this.radius = 35;

        this.type =
        Math.random() < 0.15
        ? "bomb"
        : "fruit";

        const icons = [
            "🍎","🍉","🍌","🍓",
            "🍍","🥝","🍒","🍑"
        ];

        this.icon =
        this.type === "bomb"
        ? "💣"
        : icons[Math.floor(Math.random()*icons.length)];

        this.missed = false;
    }

    update(){

        this.x += this.vx;
        this.y += this.vy;

        this.vy += 0.35;
    }

    draw(){

        ctx.font = "55px Arial";

        ctx.fillText(
            this.icon,
            this.x - 25,
            this.y + 20
        );
    }
}

function spawnFruit(){

    if(gameOver) return;

    fruits.push(new Fruit());

    setTimeout(
        spawnFruit,
        800 + Math.random()*1200
    );
}

function update(){

    for(let i=fruits.length-1;i>=0;i--){

        fruits[i].update();

        if(
            fruits[i].y >
            canvas.height + 100
        ){

            if(
                fruits[i].type === "fruit"
            ){

                lives--;

                updateUI();

                if(lives <= 0){
                    endGame();
                }
            }

            fruits.splice(i,1);
        }
    }

    if(trail.length > 0){
        trail.shift();
    }
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    fruits.forEach(fruit=>{
        fruit.draw();
    });

    if(trail.length > 1){

        ctx.beginPath();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 6;

        ctx.moveTo(
            trail[0].x,
            trail[0].y
        );

        for(let i=1;i<trail.length;i++){

            ctx.lineTo(
                trail[i].x,
                trail[i].y
            );
        }

        ctx.stroke();
    }
}

function slice(x,y){

    if(gameOver) return;

    for(let i=fruits.length-1;i>=0;i--){

        let dx =
        x - fruits[i].x;

        let dy =
        y - fruits[i].y;

        let distance =
        Math.sqrt(dx*dx + dy*dy);

        if(distance < 45){

            if(
                fruits[i].type === "bomb"
            ){

                endGame();
                return;
            }

            score++;

            if(score > highScore){

                highScore = score;

                localStorage.setItem(
                    "fruitHigh",
                    highScore
                );
            }

            fruits.splice(i,1);

            updateUI();
        }
    }
}

function addTrail(x,y){

    trail.push({x,y});

    if(trail.length > 15){
        trail.shift();
    }
}

canvas.addEventListener(
"mousemove",
e=>{

    addTrail(
        e.clientX,
        e.clientY
    );

    if(e.buttons === 1){

        slice(
            e.clientX,
            e.clientY
        );
    }
});

canvas.addEventListener(
"touchmove",
e=>{

    e.preventDefault();

    const touch =
    e.touches[0];

    addTrail(
        touch.clientX,
        touch.clientY
    );

    slice(
        touch.clientX,
        touch.clientY
    );

},
{passive:false}
);

function updateUI(){

    document.getElementById(
    "score").textContent = score;

    document.getElementById(
    "lives").textContent =
    "❤️".repeat(lives);

    document.getElementById(
    "high").textContent =
    highScore;
}

function endGame(){

    gameOver = true;

    document.getElementById(
    "gameOver"
    ).style.display = "block";
}

function restart(){

    score = 0;
    lives = 3;

    fruits.length = 0;
    trail.length = 0;

    gameOver = false;

    document.getElementById(
    "gameOver"
    ).style.display = "none";

    updateUI();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

restart();
spawnFruit();
loop();

</script>

</body>
</html>
