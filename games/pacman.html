<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pac-Man Pro</title>

<style>

body{
    margin:0;
    background:#000;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
    color:white;
    overflow:hidden;
}

canvas{
    background:#000;
    border:3px solid #22c55e;
}

.hud{
    position:absolute;
    top:10px;
    left:10px;
    font-size:18px;
    z-index:10;
}

button{
    background:#22c55e;
    border:0;
    color:white;
    padding:10px;
    border-radius:8px;
    font-size:20px;
}


.controls{
    position:absolute;
    bottom:10px;
    text-align:center;
}


.controls button{
    width:60px;
    height:60px;
    margin:3px;
}


</style>

</head>


<body>


<div class="hud">

Score:
<span id="score">0</span>

<br>

Lives:
<span id="lives">❤️❤️❤️</span>

<br>

<button onclick="restart()">Restart</button>

</div>



<canvas id="game" width="500" height="500"></canvas>



<div class="controls">

<button onclick="move('up')">⬆</button>

<br>

<button onclick="move('left')">⬅</button>

<button onclick="move('down')">⬇</button>

<button onclick="move('right')">➡</button>

</div>





<script>


const canvas =
document.getElementById("game");


const ctx =
canvas.getContext("2d");



const TILE=25;



let pac;
let ghosts;
let dots;

let score;
let lives;

let gameOver;
let win;

let frame=0;




const map=[


"####################",
"#........##........#",
"#.####...##...####.#",
"#..................#",
"#.####.######.####.#",
"#..................#",
"#.####.######.####.#",
"#........##........#",
"#.####...##...####.#",
"#..................#",
"#.####.######.####.#",
"#..................#",
"#.####.######.####.#",
"#........##........#",
"#.####...##...####.#",
"#..................#",
"#.####.######.####.#",
"#..................#",
"#........##........#",
"####################"


];







function restart(){


score=0;

lives=3;

gameOver=false;

win=false;


pac={

x:1,
y:1,
dx:0,
dy:0

};



ghosts=[


{
x:18,
y:18,
color:"red"
},


{
x:18,
y:1,
color:"pink"
},


{
x:1,
y:18,
color:"cyan"
}


];



dots=[];



for(let y=0;y<20;y++){


for(let x=0;x<20;x++){


if(map[y][x]=="."){


dots.push({
x:x,
y:y
});


}



}


}



updateHUD();

}








function updateHUD(){


document.getElementById("score").innerHTML=
score;


document.getElementById("lives").innerHTML=
"❤️".repeat(lives);


}










function movePac(){



let nx =
pac.x + pac.dx;


let ny =
pac.y + pac.dy;



if(map[ny][nx]!="#"){


pac.x=nx;

pac.y=ny;


}







for(let i=dots.length-1;i>=0;i--){



if(
dots[i].x==pac.x &&
dots[i].y==pac.y
){


dots.splice(i,1);


score+=10;


updateHUD();


}


}



if(dots.length==0)

win=true;



}









function moveGhost(g){


let options=[


{x:1,y:0},
{x:-1,y:0},
{x:0,y:1},
{x:0,y:-1}


];



options.sort(()=>Math.random()-0.5);



for(let m of options){



let nx=g.x+m.x;

let ny=g.y+m.y;



if(map[ny][nx]!="#"){



g.x=nx;

g.y=ny;


break;


}



}



}









function collision(){



for(let g of ghosts){



if(
g.x==pac.x &&
g.y==pac.y
){



lives--;


updateHUD();


pac.x=1;

pac.y=1;



if(lives<=0)

gameOver=true;



}


}



}









function draw(){


ctx.clearRect(
0,
0,
500,
500
);





// maze

for(let y=0;y<20;y++){


for(let x=0;x<20;x++){



if(map[y][x]=="#"){


ctx.fillStyle="#2563eb";


ctx.fillRect(

x*TILE,
y*TILE,
TILE,
TILE

);


}


}


}






// dots


ctx.fillStyle="white";


dots.forEach(d=>{


ctx.beginPath();


ctx.arc(

d.x*TILE+12,

d.y*TILE+12,

3,

0,

Math.PI*2

);


ctx.fill();


});








// pacman


let mouth =
Math.abs(Math.sin(frame*0.2))*0.5;



ctx.fillStyle="yellow";


ctx.beginPath();


ctx.moveTo(

pac.x*TILE+12,

pac.y*TILE+12

);



ctx.arc(

pac.x*TILE+12,

pac.y*TILE+12,

10,

mouth,

Math.PI*2-mouth

);



ctx.fill();









// ghosts


ghosts.forEach(g=>{


ctx.fillStyle=g.color;


ctx.fillRect(

g.x*TILE,

g.y*TILE,

25,

25

);


});








if(gameOver || win){



ctx.fillStyle="white";

ctx.font="30px Arial";


ctx.fillText(

win?"YOU WIN":"GAME OVER",

150,

250

);


}



}











function loop(){



if(!gameOver&&!win){


movePac();



if(frame%5==0){


ghosts.forEach(moveGhost);


}



collision();



}



draw();



frame++;



}








function move(dir){



if(dir=="left"){

pac.dx=-1;

pac.dy=0;

}



if(dir=="right"){

pac.dx=1;

pac.dy=0;

}



if(dir=="up"){

pac.dx=0;

pac.dy=-1;

}



if(dir=="down"){

pac.dx=0;

pac.dy=1;

}



}








document.addEventListener(
"keydown",
e=>{


if(e.key=="ArrowLeft")

move("left");


if(e.key=="ArrowRight")

move("right");


if(e.key=="ArrowUp")

move("up");


if(e.key=="ArrowDown")

move("down");


});








restart();


setInterval(
loop,
120
);



</script>


</body>
</html>
