<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pac-Man v3</title>

<style>

body{
margin:0;
background:#000;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
overflow:hidden;
}


canvas{
background:#000;
border:3px solid #22c55e;
width:90vw;
height:90vw;
max-width:500px;
max-height:500px;
}


.hud{
position:absolute;
top:10px;
left:10px;
z-index:5;
}


button{
background:#22c55e;
color:white;
border:0;
padding:10px;
border-radius:8px;
font-size:18px;
}


.controls{
position:absolute;
bottom:5px;
text-align:center;
}


.controls button{
width:55px;
height:55px;
margin:2px;
}


#restartBox{

display:none;

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);

background:black;
border:3px solid #22c55e;
padding:25px;

text-align:center;
z-index:20;

}


</style>

</head>



<body>


<div class="hud">

Score:
<span id="score">0</span>

<br>

High:
<span id="high">0</span>

<br>

Level:
<span id="level">1</span>

<br>

Lives:
<span id="lives">❤️❤️❤️</span>

<br>

<button onclick="restart()">Restart</button>

</div>



<canvas id="game" width="500" height="500"></canvas>




<div class="controls">

<button onclick="move('up')">⬆</button>

<br>

<button onclick="move('left')">⬅</button>

<button onclick="move('down')">⬇</button>

<button onclick="move('right')">➡</button>

</div>



<div id="restartBox">

<h1>GAME OVER</h1>

<button onclick="restart()">Restart</button>

</div>





<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


const TILE=25;



let pac;
let ghosts;
let dots;
let power;


let score;
let lives;
let level;

let scared=false;
let scaredTime=0;

let high =
localStorage.getItem("pacHigh") || 0;



let gameOver=false;

let frame=0;



const map=[

"####################",
"#o.......##.......o#",
"#.####...##...####.#",
"#..................#",
"#.####.######.####.#",
"#..................#",
"#.####.######.####.#",
"#........##........#",
"#.####...##...####.#",
"#..................#",
"#.####.######.####.#",
"#..................#",
"#.####.######.####.#",
"#........##........#",
"#.####...##...####.#",
"#..................#",
"#.####.######.####.#",
"#..................#",
"#o.......##.......o#",
"####################"

];







function restart(){


score=0;
lives=3;
level=1;

gameOver=false;


pac={
x:1,
y:1,
dx:0,
dy:0
};



ghosts=[

{x:18,y:18,color:"red"},
{x:18,y:1,color:"pink"},
{x:1,y:18,color:"cyan"}

];



dots=[];

power=[];



for(let y=0;y<20;y++){

for(let x=0;x<20;x++){



if(map[y][x]==".")
dots.push({x,y});


if(map[y][x]=="o")
power.push({x,y});


}

}


document.getElementById("restartBox").style.display="none";

update();


}







function update(){


document.getElementById("score").innerHTML=score;

document.getElementById("high").innerHTML=high;

document.getElementById("level").innerHTML=level;

document.getElementById("lives").innerHTML=
"❤️".repeat(lives);


}







function movePac(){


let nx=pac.x+pac.dx;
let ny=pac.y+pac.dy;


if(map[ny][nx]!="#"){

pac.x=nx;
pac.y=ny;

}





dots=dots.filter(d=>{


if(d.x==pac.x&&d.y==pac.y){

score+=10;

return false;

}


return true;


});






power=power.filter(p=>{


if(p.x==pac.x&&p.y==pac.y){


scared=true;

scaredTime=150;


score+=50;


return false;


}


return true;


});




if(score>high){

high=score;

localStorage.setItem(
"pacHigh",
high
);


}



update();


}







function ghostMove(g){


let dirs=[

{x:1,y:0},
{x:-1,y:0},
{x:0,y:1},
{x:0,y:-1}

];


let best=dirs[0];


if(!scared){


dirs.sort(()=>Math.random()-0.5);


best=dirs[0];


}



let nx=g.x+best.x;
let ny=g.y+best.y;



if(map[ny][nx]!="#"){

g.x=nx;
g.y=ny;

}



}









function collision(){



ghosts.forEach(g=>{



if(g.x==pac.x&&g.y==pac.y){



if(scared){


score+=200;


g.x=18;
g.y=18;


}


else{


lives--;


update();


pac.x=1;
pac.y=1;



if(lives<=0){


gameOver=true;


document.getElementById("restartBox").style.display="block";


}



}


}


});



}










function draw(){


ctx.clearRect(0,0,500,500);



for(let y=0;y<20;y++){

for(let x=0;x<20;x++){


if(map[y][x]=="#"){


ctx.fillStyle="#2563eb";

ctx.fillRect(
x*TILE,
y*TILE,
TILE,
TILE
);


}


}


}




ctx.fillStyle="white";

dots.forEach(d=>{


ctx.beginPath();

ctx.arc(
d.x*TILE+12,
d.y*TILE+12,
3,
0,
Math.PI*2
);

ctx.fill();


});




ctx.fillStyle="cyan";


power.forEach(p=>{


ctx.beginPath();

ctx.arc(
p.x*TILE+12,
p.y*TILE+12,
8,
0,
Math.PI*2
);

ctx.fill();


});






ctx.fillStyle="yellow";


ctx.beginPath();

ctx.arc(
pac.x*TILE+12,
pac.y*TILE+12,
10,
0,
Math.PI*2
);

ctx.fill();






ghosts.forEach(g=>{


ctx.fillStyle=
scared?"blue":g.color;


ctx.fillRect(
g.x*TILE,
g.y*TILE,
25,
25
);


});




}







function loop(){


if(!gameOver){


movePac();


if(frame%4==0)

ghosts.forEach(ghostMove);


collision();


if(scaredTime>0)

scaredTime--;

else

scared=false;



}


draw();


frame++;


}



function move(d){

if(d=="left"){
pac.dx=-1;pac.dy=0;
}

if(d=="right"){
pac.dx=1;pac.dy=0;
}

if(d=="up"){
pac.dx=0;pac.dy=-1;
}

if(d=="down"){
pac.dx=0;pac.dy=1;
}


}



document.addEventListener(
"keydown",
e=>{


if(e.key=="ArrowLeft")move("left");

if(e.key=="ArrowRight")move("right");

if(e.key=="ArrowUp")move("up");

if(e.key=="ArrowDown")move("down");


});





restart();

setInterval(loop,90);



</script>

</body>
</html>
