<!DOCTYPE html>
<html>
<head>
<title>Sudoku Game</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#0b1020;
    font-family:Arial;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(9,40px);
    gap:2px;
    padding:10px;
    border:2px solid #22c55e;
}

input{
    width:40px;
    height:40px;
    text-align:center;
    font-size:18px;
    background:#1f2937;
    color:white;
    border:1px solid #374151;
}

input.error{
    background:#7f1d1d;
}

button{
    margin-top:10px;
    padding:8px 14px;
    border:none;
    background:#22c55e;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>Sudoku</h2>
<div class="grid" id="grid"></div>

<button onclick="check()">Check Board</button>

<script>
const grid = document.getElementById("grid");

let board = [
5,3,0,0,7,0,0,0,0,
6,0,0,1,9,5,0,0,0,
0,9,8,0,0,0,0,6,0,
8,0,0,0,6,0,0,0,3,
4,0,0,8,0,3,0,0,1,
7,0,0,0,2,0,0,0,6,
0,6,0,0,0,0,2,8,0,
0,0,0,4,1,9,0,0,5,
0,0,0,0,8,0,0,7,9
];

let inputs = [];

function draw(){

    grid.innerHTML="";
    inputs=[];

    board.forEach((val,i)=>{

        let input = document.createElement("input");
        input.value = val===0 ? "" : val;

        input.oninput = () => {
            board[i] = Number(input.value)||0;
            validate();
        };

        inputs.push(input);
        grid.appendChild(input);
    });
}

function validate(){

    let size = 9;

    // reset errors
    inputs.forEach(i=>i.classList.remove("error"));

    function markError(index){
        inputs[index].classList.add("error");
    }

    // check rows
    for(let r=0;r<size;r++){
        let seen = {};
        for(let c=0;c<size;c++){
            let i = r*9+c;
            let v = board[i];
            if(v===0) continue;
            if(seen[v]){ markError(i); markError(seen[v]); }
            else seen[v]=i;
        }
    }

    // check cols
    for(let c=0;c<size;c++){
        let seen = {};
        for(let r=0;r<size;r++){
            let i = r*9+c;
            let v = board[i];
            if(v===0) continue;
            if(seen[v]){ markError(i); markError(seen[v]); }
            else seen[v]=i;
        }
    }

    // check 3x3 boxes
    for(let br=0;br<3;br++){
        for(let bc=0;bc<3;bc++){

            let seen={};

            for(let r=0;r<3;r++){
                for(let c=0;c<3;c++){

                    let i = (br*3+r)*9 + (bc*3+c);
                    let v = board[i];

                    if(v===0) continue;

                    if(seen[v]){
                        markError(i);
                        markError(seen[v]);
                    } else {
                        seen[v]=i;
                    }
                }
            }
        }
    }
}

function check(){
    validate();
    alert("Errors highlighted in red!");
}

draw();
validate();
</script>

</body>
</html>
