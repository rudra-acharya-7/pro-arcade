<!DOCTYPE html>
<html>
<head>

<title>Chess Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

body{
    margin:0;
    min-height:100vh;
    background:#0b1020;
    color:white;
    font-family:Arial;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:auto;
}


#info{
    font-size:22px;
    margin-bottom:12px;
}


#board{

    width:min(92vw,500px);
    height:min(92vw,500px);

    display:grid;
    grid-template-columns:repeat(8,1fr);

    border:4px solid #22c55e;

    box-sizing:border-box;

    touch-action:none;
}



.square{

    aspect-ratio:1;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:clamp(28px,10vw,55px);

    user-select:none;

    touch-action:none;

    -webkit-tap-highlight-color:transparent;
}



.light{
    background:#f1f5f9;
    color:#111827;
}


.dark{
    background:#334155;
}


.selected{

    outline:4px solid #facc15;

}



.move{

box-shadow:
inset 0 0 0 5px #22c55e;

}



button{

margin-top:15px;

padding:14px 40px;

background:#22c55e;

border:none;

border-radius:12px;

color:white;

font-size:20px;

}



</style>

</head>


<body>


<div id="info">
Turn: <span id="turn">White</span>
</div>


<div id="board"></div>


<button onclick="restart()">
Restart
</button>



<script>


const board =
document.getElementById("board");


const info =
document.getElementById("info");


let game = new Chess();


let selected=null;

let ended=false;



const pieces={

p:"♟",
r:"♜",
n:"♞",
b:"♝",
q:"♛",
k:"♚",

P:"♙",
R:"♖",
N:"♘",
B:"♗",
Q:"♕",
K:"♔"

};



const squares=[

"a8","b8","c8","d8","e8","f8","g8","h8",

"a7","b7","c7","d7","e7","f7","g7","h7",

"a6","b6","c6","d6","e6","f6","g6","h6",

"a5","b5","c5","d5","e5","f5","g5","h5",

"a4","b4","c4","d4","e4","f4","g4","h4",

"a3","b3","c3","d3","e3","f3","g3","h3",

"a2","b2","c2","d2","e2","f2","g2","h2",

"a1","b1","c1","d1","e1","f1","g1","h1"

];





function draw(){


board.innerHTML="";



squares.forEach((sq,i)=>{


let div=document.createElement("div");


div.className="square ";



div.className +=

((Math.floor(i/8)+i)%2)

?

"dark"

:

"light";



let piece=game.get(sq);



if(piece){


let p =
piece.color=="w"
?
piece.type.toUpperCase()
:
piece.type;


div.innerHTML =
pieces[p];

}



if(selected==sq)

div.classList.add("selected");




if(selected){


let moves =
game.moves({

square:selected,

verbose:true

});



moves.forEach(m=>{


if(m.to==sq)

div.classList.add("move");


});

}


div.addEventListener("click",function(){

clickSquare(sq);

});



div.addEventListener("touchend",function(e){

e.preventDefault();

clickSquare(sq);


},{passive:false});



board.appendChild(div);


});


updateInfo();


}





function updateInfo(){


if(ended)
return;



let text =
game.turn()=="w"
?
"White"
:
"Black";



if(game.isCheck())

text += " ⚠ CHECK";



info.innerHTML =
"Turn: "+text;


}





function clickSquare(sq){



if(ended)
return;



if(selected){



let move =
game.move({

from:selected,

to:sq,

promotion:"q"

});



if(move){


selected=null;

checkGame();


}

else{


selected=sq;


}


draw();

return;


}




let piece =
game.get(sq);



if(!piece)

return;



if(
game.turn()=="w" &&
piece.color!="w"
)

return;



if(
game.turn()=="b" &&
piece.color!="b"
)

return;




selected=sq;


draw();


}






function checkGame(){



if(game.isCheckmate()){


ended=true;


alert("Checkmate!");

}


else if(game.isDraw()){


ended=true;


alert("Draw");

}


}





function restart(){


game.reset();

selected=null;

ended=false;


draw();


}



draw();



</script>


</body>
</html>
