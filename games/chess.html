<!DOCTYPE html>
<html>
<head>

<title>Chess Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{

margin:0;
height:100vh;
background:#0b1020;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
flex-direction:column;

}



#info{

margin-bottom:10px;
font-size:20px;

}


#board{

display:grid;
grid-template-columns:repeat(8,1fr);

width:90vw;
max-width:480px;

aspect-ratio:1;

border:4px solid #22c55e;

}



.cell{

display:flex;
align-items:center;
justify-content:center;

font-size:clamp(25px,8vw,45px);

cursor:pointer;

}



.white{

background:#e5e7eb;
color:black;

}



.black{

background:#374151;

}



.selected{

outline:4px solid yellow;
}


.move{

box-shadow:inset 0 0 0 4px #22c55e;

}



button{

margin-top:15px;
padding:10px 20px;
background:#22c55e;
color:white;
border:0;
border-radius:8px;
font-size:18px;

}


</style>

</head>


<body>


<div id="info">

Turn:
<span id="turn">White</span>

<br>

Moves:
<span id="moves">0</span>

</div>


<div id="board"></div>


<button onclick="restart()">Restart</button>





<script>


const board=document.getElementById("board");



const pieces={

r:"♜",
n:"♞",
b:"♝",
q:"♛",
k:"♚",
p:"♟",

R:"♖",
N:"♘",
B:"♗",
Q:"♕",
K:"♔",
P:"♙"

};



let state;


let selected=null;

let turn;

let moves;

let possible=[];




function restart(){


state=[

"r","n","b","q","k","b","n","r",

"p","p","p","p","p","p","p","p",

"","","","","","","","",

"","","","","","","","",

"","","","","","","","",

"","","","","","","",

"P","P","P","P","P","P","P","P",

"R","N","B","Q","K","B","N","R"

];


selected=null;

possible=[];

turn="white";

moves=0;


draw();

}




function white(p){

return p && p===p.toUpperCase();

}



function black(p){

return p && p===p.toLowerCase();

}





function valid(from,to,p){



let dx=
(to%8)-(from%8);


let dy=
Math.floor(to/8)-Math.floor(from/8);



switch(p.toLowerCase()){



case"p":

let dir=white(p)?-1:1;


if(dx==0 &&
state[to]=="" &&
dy==dir)

return true;



if(
Math.abs(dx)==1 &&
dy==dir &&
state[to]!=""

)

return true;


break;



case"r":

return dx==0||dy==0;



case"b":

return Math.abs(dx)==Math.abs(dy);



case"q":

return dx==0||
dy==0||
Math.abs(dx)==Math.abs(dy);



case"n":

return (
Math.abs(dx)==2 &&
Math.abs(dy)==1
)
||
(
Math.abs(dx)==1 &&
Math.abs(dy)==2
);



case"k":

return Math.abs(dx)<=1 &&
Math.abs(dy)<=1;


}


return false;


}







function showMoves(i){


possible=[];


for(let x=0;x<64;x++){


if(valid(i,x,state[i])){


if(
state[x]=="" ||
white(state[x])!=white(state[i])
)

possible.push(x);


}


}


}










function draw(){



board.innerHTML="";



for(let i=0;i<64;i++){


let c=document.createElement("div");


c.className="cell ";


c.className+=
((Math.floor(i/8)+i)%2)
?"black"
:"white";



if(selected==i)

c.classList.add("selected");



if(possible.includes(i))

c.classList.add("move");



c.innerHTML=
pieces[state[i]]||"";



c.onclick=()=>clickCell(i);



board.appendChild(c);


}



document.getElementById("turn").innerHTML=
turn;


document.getElementById("moves").innerHTML=
moves;


}








function clickCell(i){



let p=state[i];



if(selected===null){



if(p=="")
return;



if(turn=="white" && !white(p))
return;


if(turn=="black" && !black(p))
return;



selected=i;


showMoves(i);


draw();

return;


}






if(possible.includes(i)){



if(
state[i]=="k" ||
state[i]=="K"

){

alert("King captured! "+turn+" wins");

restart();

return;

}




state[i]=state[selected];

state[selected]="";


moves++;


turn=
turn=="white"
?"black"
:"white";

}



selected=null;

possible=[];

draw();



}






restart();



</script>


</body>
</html>
