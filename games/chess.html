<!DOCTYPE html>
<html>
<head>

<title>Chess Pro v2</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
height:100vh;
background:#0b1020;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
}


#info{
font-size:20px;
margin-bottom:10px;
}


#board{

width:90vw;
max-width:480px;

aspect-ratio:1;

display:grid;
grid-template-columns:repeat(8,1fr);

border:4px solid #22c55e;

}


.cell{

display:flex;
justify-content:center;
align-items:center;

font-size:clamp(25px,8vw,45px);

cursor:pointer;
user-select:none;

}



.white{
background:#e5e7eb;
color:black;
}


.black{
background:#374151;
}



.selected{

outline:4px solid yellow;

}



.move{

box-shadow:
inset 0 0 0 4px #22c55e;

}



button{

margin-top:15px;

padding:10px 25px;

background:#22c55e;

color:white;

border:0;

border-radius:10px;

font-size:18px;

}


</style>

</head>



<body>



<div id="info">

Turn:
<span id="turn">White</span>

<br>

Moves:
<span id="moves">0</span>

</div>



<div id="board"></div>


<button onclick="restart()">
Restart
</button>






<script>


const board =
document.getElementById("board");



const pieces={

r:"♜",
n:"♞",
b:"♝",
q:"♛",
k:"♚",
p:"♟",

R:"♖",
N:"♘",
B:"♗",
Q:"♕",
K:"♔",
P:"♙"

};




let state;

let selected=null;

let possible=[];

let turn="white";

let moves=0;





function restart(){


state=[

"r","n","b","q","k","b","n","r",

"p","p","p","p","p","p","p","p",

"","","","","","","","",

"","","","","","","","",

"","","","","","","","",

"","","","","","","","",

"P","P","P","P","P","P","P","P",

"R","N","B","Q","K","B","N","R"

];


selected=null;

possible=[];

turn="white";

moves=0;


draw();


}







function isWhite(p){

return p && p===p.toUpperCase();

}


function isBlack(p){

return p && p===p.toLowerCase();

}







function clearPath(from,to){


let fx=from%8;

let fy=Math.floor(from/8);


let tx=to%8;

let ty=Math.floor(to/8);



let xs=Math.sign(tx-fx);

let ys=Math.sign(ty-fy);



let x=fx+xs;

let y=fy+ys;



while(x!=tx || y!=ty){


if(state[y*8+x]!="")

return false;


x+=xs;
y+=ys;


}


return true;


}









function valid(from,to,p){


let fx=from%8;

let fy=Math.floor(from/8);


let tx=to%8;

let ty=Math.floor(to/8);



let dx=tx-fx;

let dy=ty-fy;



switch(p.toLowerCase()){



case "p":


let dir=isWhite(p)?-1:1;


if(dx==0 &&
dy==dir &&
state[to]=="")
return true;



if(
Math.abs(dx)==1 &&
dy==dir &&
state[to]!="" &&
isWhite(state[to])!=isWhite(p)
)

return true;


break;







case "r":

return (dx==0||dy==0)
&&clearPath(from,to);






case "b":

return Math.abs(dx)==Math.abs(dy)
&&clearPath(from,to);








case "q":

return (
dx==0 ||
dy==0 ||
Math.abs(dx)==Math.abs(dy)
)
&&clearPath(from,to);







case "n":


return (

Math.abs(dx)==2 &&
Math.abs(dy)==1

)||

(

Math.abs(dx)==1 &&
Math.abs(dy)==2

);







case "k":

return Math.abs(dx)<=1 &&
Math.abs(dy)<=1;


}


return false;


}









function findMoves(i){


possible=[];



for(let x=0;x<64;x++){



if(valid(i,x,state[i])){


if(
state[x]=="" ||
isWhite(state[x])!=isWhite(state[i])
)

possible.push(x);



}



}



}









function draw(){



board.innerHTML="";



for(let i=0;i<64;i++){



let cell=document.createElement("div");



cell.className="cell ";



cell.className +=

((Math.floor(i/8)+i)%2)

?"black"

:"white";





if(selected==i)

cell.classList.add("selected");



if(possible.includes(i))

cell.classList.add("move");





cell.innerHTML =
pieces[state[i]] || "";




cell.onclick =
()=>clickCell(i);




board.appendChild(cell);


}




document.getElementById("turn")
.innerHTML=turn;



document.getElementById("moves")
.innerHTML=moves;



}









function clickCell(i){


let p=state[i];



if(selected===null){



if(p=="")
return;



if(turn=="white" && !isWhite(p))
return;



if(turn=="black" && !isBlack(p))
return;



selected=i;


findMoves(i);


draw();


return;


}






if(possible.includes(i)){


state[i]=state[selected];


state[selected]="";


moves++;


turn =
turn=="white"
?
"black"
:
"white";


}



selected=null;

possible=[];


draw();



}







document.addEventListener(
"keydown",
e=>{


if(e.key=="r")

restart();


});



restart();



</script>



</body>
</html>
