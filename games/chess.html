<!DOCTYPE html>
<html>
<head>

<title>Chess Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>


<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}


body{

    margin:0;
    min-height:100vh;

    background:#0b1020;

    color:white;

    font-family:Arial;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    touch-action:none;
}



#info{

    font-size:22px;

    margin-bottom:15px;

}



#board{

    width:min(90vw,500px);

    height:min(90vw,500px);

    display:grid;

    grid-template-columns:repeat(8,1fr);

    grid-template-rows:repeat(8,1fr);

    border:4px solid #22c55e;

}



.square{

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;


    font-size:clamp(25px,9vw,55px);


    user-select:none;

    touch-action:none;

}



.light{

    background:#f1f5f9;

    color:#111827;

}



.dark{

    background:#334155;

}



.selected{

    outline:5px solid #facc15;

}




button{

    margin-top:20px;

    padding:12px 35px;

    font-size:20px;

    border:none;

    border-radius:10px;

    background:#22c55e;

    color:white;

}



</style>


</head>


<body>



<div id="info">
Turn: White
</div>



<div id="board"></div>



<button id="restart">
Restart
</button>




<script>


const board =
document.getElementById("board");


const info =
document.getElementById("info");


const restart =
document.getElementById("restart");



let game = new Chess();


let selected = null;



const pieces={

p:"♟",
r:"♜",
n:"♞",
b:"♝",
q:"♛",
k:"♚",

P:"♙",
R:"♖",
N:"♘",
B:"♗",
Q:"♕",
K:"♔"

};



const squares=[

"a8","b8","c8","d8","e8","f8","g8","h8",

"a7","b7","c7","d7","e7","f7","g7","h7",

"a6","b6","c6","d6","e6","f6","g6","h6",

"a5","b5","c5","d5","e5","f5","g5","h5",

"a4","b4","c4","d4","e4","f4","g4","h4",

"a3","b3","c3","d3","e3","f3","g3","h3",

"a2","b2","c2","d2","e2","f2","g2","h2",

"a1","b1","c1","d1","e1","f1","g1","h1"

];






function draw(){


board.innerHTML="";



squares.forEach((sq,i)=>{


let box =
document.createElement("div");



box.className="square ";



box.className +=

((Math.floor(i/8)+i)%2)

?

"dark"

:

"light";





let piece =
game.get(sq);




if(piece){


let p =

piece.color=="w"

?

piece.type.toUpperCase()

:

piece.type;



box.textContent =
pieces[p];


}




if(selected==sq){

box.classList.add("selected");

}




box.addEventListener("pointerdown",function(e){

    e.preventDefault();

    play(sq);

});




board.appendChild(box);



});



update();


}





function play(square){



if(selected){



let move =
game.move({

from:selected,

to:square,

promotion:"q"

});




if(move){

selected=null;

}

else{


let piece =
game.get(square);



if(piece && piece.color==game.turn()){

selected=square;

}

else{

selected=null;

}


}



draw();

return;


}





let piece =
game.get(square);



if(!piece)

return;



if(piece.color != game.turn())

return;



selected=square;



draw();


}






function update(){



info.textContent =

"Turn: " +

(game.turn()=="w" ? "White" : "Black");



if(game.isCheck()){

info.textContent += " CHECK";

}


}





restart.onclick=function(){


game.reset();


selected=null;


draw();


};




draw();



</script>


</body>
</html>g
